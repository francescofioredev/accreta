name: MCP clients

# Drives the MCP server from client SDKs other than the TypeScript one it is built on.
# Self-contained on purpose: nothing here depends on ci.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-sdk:
    name: Python SDK over stdio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/clients/python/requirements.txt

      - name: Install the Python client
        run: pip install -r test/clients/python/requirements.txt

      - name: Test
        run: python -m pytest test/clients/python -v
