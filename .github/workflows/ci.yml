name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells you nothing useful: cancel it and keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: test · typecheck · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # --frozen-lockfile: CI must fail on a stale lockfile rather than quietly
      # resolving different versions than the ones that were reviewed.
      - name: Install
        run: bun install --frozen-lockfile

      # Each step runs even if an earlier one failed, so a pull request gets the
      # full picture in one pass instead of one error per push.
      - name: Test
        id: test
        run: bun test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Format
        if: ${{ !cancelled() }}
        run: bun run format:check

  demo:
    name: demo knowledge base
    runs-on: ubuntu-latest
    steps:
      # The demo's citations name a commit, and its pages claim to be verified
      # against it. Left unchecked that decays silently — which is precisely the
      # failure this project exists to detect, so it would be a poor look.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Reindex
        working-directory: examples/climate
        run: bun run ../../packages/cli/src/main.ts reindex

      # lint exits non-zero on a broken link, a missing citation, or a page type
      # outside the configured vocabulary.
      - name: Lint
        working-directory: examples/climate
        run: bun run ../../packages/cli/src/main.ts lint

      # `drift` is deliberately not run here. The demo's pages are verified
      # against the commit that introduced them, so every later commit to this
      # repository makes them legitimately stale — the tool would be reporting
      # correctly and CI would be red for it. Re-verifying the demo is an
      # editorial act, not something a build should paper over.
