name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells you nothing useful: cancel it and keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: test · typecheck · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The packaging test runs the installed bins under `node` as well as Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # --frozen-lockfile catches a changed *registry* dependency, and does not catch a stale
      # workspace member: bun resolves those by path, so the versions recorded beside them are
      # informational and a lockfile naming the wrong one installs clean.
      # test/lockfile.test.ts is the guard for that half.
      - name: Install
        run: bun install --frozen-lockfile

      # Each step runs even if an earlier one failed, so a pull request gets the
      # full picture in one pass instead of one error per push.
      - name: Test
        id: test
        run: bun run test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Format
        if: ${{ !cancelled() }}
        run: bun run format:check

  demo:
    name: demo knowledge base
    runs-on: ubuntu-latest
    steps:
      # The demo's citations name a commit, and its pages claim to be verified
      # against it. Left unchecked that decays silently — which is precisely the
      # failure this project exists to detect, so it would be a poor look.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Reindex
        working-directory: examples/climate
        run: bun --conditions=@accreta/source ../../packages/cli/src/bin.ts reindex

      # lint exits non-zero on a broken link, a missing citation, a page type
      # outside the configured vocabulary, or a citation whose path or line range
      # does not exist in the source it names.
      # The output is asserted too: a CLI that never ran its command also exits 0.
      - name: Lint
        working-directory: examples/climate
        run: |
          out=$(bun --conditions=@accreta/source ../../packages/cli/src/bin.ts lint)
          echo "$out"
          grep -q "nothing to report" <<<"$out"

      # `drift` is deliberately not run here. The demo's pages are verified against the commit
      # that introduced them, so every later commit to this repository makes them legitimately
      # stale — the tool would be reporting correctly and CI would be red for it. Re-verifying
      # the demo is an editorial act, not something a build should paper over.

  # Both ends of ADR-0016's range, paired oldest with oldest and current with current.
  runtimes:
    name: ${{ matrix.os }} · node ${{ matrix.runtime.node }} · bun ${{ matrix.runtime.bun }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Windows is unsupported until it is measured green (docs/platform-support.md).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime:
          - { node: 22.16.0, bun: 1.4.0 }
          - { node: 24, bun: latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.runtime.bun }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime.node }}

      - name: Install
        run: bun install --frozen-lockfile

      # Node 22.12 has no node:sqlite and 22.14 has no FTS5; both must be refused by name.
      # Official builds, not the npm `node` package, whose install scripts would run here.
      # Each SHASUMS256.txt is pinned by hash, checked once against its release signature.
      - name: Fetch the runtimes accreta must refuse
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ext=tar.gz bin=bin/node ;;
            macOS-ARM64) platform=darwin-arm64 ext=tar.gz bin=bin/node ;;
            Windows-X64) platform=win-x64 ext=zip bin=node.exe ;;
            *) echo "no Node build mapped for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          sha256() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          cd "$RUNNER_TEMP"
          runtimes=()
          for pin in \
            22.12.0=4d4dc7ec5755c7b034127c9f13ba83efe9869d2aa11c173d901a551da0f4649f \
            22.14.0=d67cdb735b1764bf5b553a0d9b067ed861b91a4d934afc20442c04f5234b55db; do
            version=${pin%%=*}
            name="node-v$version-$platform"
            curl -fsSL -o "SHASUMS256-$version.txt" "https://nodejs.org/dist/v$version/SHASUMS256.txt"
            echo "${pin#*=}  SHASUMS256-$version.txt" | sha256 -c -
            curl -fsSL -o "$name.$ext" "https://nodejs.org/dist/v$version/$name.$ext"
            grep "  $name.$ext\$" "SHASUMS256-$version.txt" | sha256 -c -
            if [ "$ext" = zip ]; then unzip -q "$name.$ext"; else tar -xzf "$name.$ext"; fi
            path="$RUNNER_TEMP/$name/$bin"
            if [ "$RUNNER_OS" = Windows ]; then path=$(cygpath -w "$path"); fi
            "$path" --version
            runtimes+=("$path")
          done
          # The test splits on the platform's path delimiter.
          if [ "$RUNNER_OS" = Windows ]; then IFS=';'; else IFS=':'; fi
          echo "ACCRETA_UNSUPPORTED_RUNTIMES=${runtimes[*]}" >> "$GITHUB_ENV"

      # Every probe and the suite run even after a failure, so one pass shows all of a cell's state.
      - name: SQLite probes
        run: |
          status=0
          for runtime in node bun; do
            for probe in sqlite runtime; do
              "$runtime" "docs/adr/0016-$probe-probe.mjs" || status=1
            done
          done
          exit $status

      # The whole suite, packaging test included, so each OS and runtime pair runs every test.
      - name: Test
        if: ${{ !cancelled() }}
        run: bun run test

      - name: TEMPORARY fail one supported cell to prove the aggregate fails
        if: ${{ matrix.os == 'macos-latest' && matrix.runtime.bun == '1.4.0' }}
        run: exit 1

  # One stable name to require on main, however the matrix changes.
  runtime-matrix:
    name: runtime matrix
    needs: runtimes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A skipped or cancelled matrix would otherwise count as passing.
      - name: Every supported cell passed
        run: test "${{ needs.runtimes.result }}" = success
