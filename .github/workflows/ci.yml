name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells you nothing useful: cancel it and keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: test · typecheck · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # --frozen-lockfile: CI must fail on a stale lockfile rather than quietly
      # resolving different versions than the ones that were reviewed.
      - name: Install
        run: bun install --frozen-lockfile

      # Each step runs even if an earlier one failed, so a pull request gets the
      # full picture in one pass instead of one error per push.
      - name: Test
        id: test
        run: bun test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Format
        if: ${{ !cancelled() }}
        run: bun run format:check
