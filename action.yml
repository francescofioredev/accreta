name: accreta drift
description: Comment on a pull request with the knowledge base pages whose cited lines it changed.
author: francescofioredev
branding:
  icon: book-open
  color: blue

inputs:
  working-directory:
    description: The knowledge base to check, relative to the repository root.
    default: "."
  github-token:
    description: Token that posts the comment. The workflow's own is enough.
    default: ${{ github.token }}
  comment-author:
    description: Login that posts the comment, used to find it again. Change it with github-token.
    default: github-actions[bot]
  comment-when-clean:
    description: Post a comment even when nothing is new. An existing comment is always updated.
    default: "false"
  fail-on-drift:
    description: Fail the step when a page is newly in doubt, newly at a revision nobody can place, or a source declaration does not load. An unloaded source counts even when the base branch already had it, so it fails every pull request until it is fixed.
    default: "false"

outputs:
  pages-in-doubt:
    description: Pages whose cited lines changed, including those already in doubt on the base branch.
    value: ${{ steps.drift.outputs.pages-in-doubt }}
  pages-newly-in-doubt:
    description: Pages with a cited line in doubt that the base branch did not have in doubt.
    value: ${{ steps.drift.outputs.pages-newly-in-doubt }}
  pages-unplaceable:
    description: Pages verified at a revision the source cannot place.
    value: ${{ steps.drift.outputs.pages-unplaceable }}
  pages-newly-unplaceable:
    description: Unplaceable pages the base branch did not have at the same revision.
    value: ${{ steps.drift.outputs.pages-newly-unplaceable }}
  sources-unloaded:
    description: Source declarations that did not load, so nothing citing them was checked.
    value: ${{ steps.drift.outputs.sources-unloaded }}

runs:
  using: composite
  steps:
    # Pinned by commit: this step runs in a job that holds a token able to write.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2

    # The action runs accreta from its own checkout, so the CLI is the version the action is pinned to.
    - name: Install accreta
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --production

    - name: Check drift
      id: drift
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACCRETA_INDEX_PATH: ${{ runner.temp }}/accreta-drift.sqlite
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        cli=(bun --conditions=@accreta/source "$GITHUB_ACTION_PATH/packages/cli/src/bin.ts")
        "${cli[@]}" reindex

        # Drift on the base branch is what was already in doubt before this change.
        compare=()
        rev="$RUNNER_TEMP/accreta-base-revision"
        rm -f "$rev"
        bun "$GITHUB_ACTION_PATH/scripts/drift-base.ts" "$rev"
        if [ -s "$rev" ]; then
          base="$RUNNER_TEMP/accreta-base"
          # A registration left by an earlier run on this runner would make `add` fail.
          git worktree prune
          rm -rf "$base"
          git worktree add --quiet --force --detach "$base" "$(cat "$rev")"
          trap 'git worktree remove --force "$base" || true' EXIT
          kb="$base/$(git rev-parse --show-prefix)"
          report="$RUNNER_TEMP/accreta-base.json"
          if [ ! -f "$kb/accreta.config.yaml" ]; then
            echo "::notice::The base branch has no knowledge base here: every page counts as new."
          elif (
            cd "$kb" &&
              export ACCRETA_INDEX_PATH="$RUNNER_TEMP/accreta-base.sqlite" &&
              "${cli[@]}" reindex >/dev/null &&
              { "${cli[@]}" drift --json >"$report" || [ -s "$report" ]; }
          ); then
            compare=(--base "$report")
          else
            echo "::warning::accreta failed on the base branch, so nothing is compared: every page counts as new."
          fi
        fi

        # Exit 1 means drift found something; any other failure leaves the report empty.
        "${cli[@]}" drift --format github "${compare[@]}" >"$RUNNER_TEMP/accreta-drift.md" || true
        if [ ! -s "$RUNNER_TEMP/accreta-drift.md" ]; then
          echo "::error::accreta drift failed before writing a report."
          exit 1
        fi
        "${cli[@]}" drift --json "${compare[@]}" >"$RUNNER_TEMP/accreta-drift.json" || true
        bun -e '
          const r = JSON.parse(await Bun.file(process.argv[1]).text());
          console.log(`pages-in-doubt=${r.pages_in_doubt}`);
          console.log(`pages-newly-in-doubt=${r.pages_newly_in_doubt}`);
          console.log(`pages-unplaceable=${r.pages_unplaceable}`);
          console.log(`pages-newly-unplaceable=${r.pages_newly_unplaceable}`);
          console.log(`sources-unloaded=${r.unloaded_sources.length}`);
          console.log(`attention=${r.pages_newly_in_doubt + r.pages_newly_unplaceable + r.unloaded_sources.length}`);
        ' "$RUNNER_TEMP/accreta-drift.json" >>"$GITHUB_OUTPUT"

    - name: Comment on the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRIFT_REPORT: ${{ runner.temp }}/accreta-drift.md
        DRIFT_KEY: ${{ inputs.working-directory }}
        DRIFT_AUTHOR: ${{ inputs.comment-author }}
        DRIFT_CREATE: ${{ inputs.comment-when-clean == 'true' || steps.drift.outputs.attention != '0' }}
      run: bun "$GITHUB_ACTION_PATH/scripts/drift-comment.ts"

    - name: Fail on drift
      if: ${{ inputs.fail-on-drift == 'true' && steps.drift.outputs.attention != '0' }}
      shell: bash
      run: |
        echo "::error::This pull request puts pages in doubt or at a revision nobody can place, or a source declaration did not load."
        exit 1
