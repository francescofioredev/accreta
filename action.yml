name: accreta drift
description: Comment on a pull request with the knowledge base pages whose cited lines it changed.
author: francescofioredev
branding:
  icon: book-open
  color: blue

inputs:
  working-directory:
    description: The knowledge base to check, relative to the repository root.
    default: "."
  github-token:
    description: Token that posts the comment. The workflow's own is enough.
    default: ${{ github.token }}
  comment-author:
    description: Login that posts the comment, used to find it again. Change it with github-token.
    default: github-actions[bot]
  comment-when-clean:
    description: Post a comment even when no page is newly in doubt. An existing comment is always updated.
    default: "false"
  fail-on-drift:
    description: Fail the step when the pull request puts a page newly in doubt.
    default: "false"

outputs:
  pages-in-doubt:
    description: Pages whose cited lines changed, including those already in doubt on the base branch.
    value: ${{ steps.drift.outputs.pages-in-doubt }}
  pages-newly-in-doubt:
    description: Pages with a cited line in doubt that the base branch did not have in doubt.
    value: ${{ steps.drift.outputs.pages-newly-in-doubt }}
  pages-unplaceable:
    description: Pages verified at a revision the source cannot place.
    value: ${{ steps.drift.outputs.pages-unplaceable }}

runs:
  using: composite
  steps:
    # Pinned by commit: this step runs in a job that holds a token able to write.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.13

    # The action runs accreta from its own checkout, so the CLI is the version the action is pinned to.
    - name: Install accreta
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --production

    - name: Check drift
      id: drift
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACCRETA_INDEX_PATH: ${{ runner.temp }}/accreta-drift.sqlite
        KB: ${{ inputs.working-directory }}
      run: |
        cli="$GITHUB_ACTION_PATH/packages/cli/src/main.ts"
        bun "$cli" reindex

        # A pull_request checkout is a merge commit whose first parent is the base branch. Drift
        # there is what was already in doubt before this change.
        compare=()
        if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
          base="$RUNNER_TEMP/accreta-base"
          git worktree add --quiet --detach "$base" 'HEAD^1'
          trap 'git worktree remove --force "$base"' EXIT
          report="$RUNNER_TEMP/accreta-base.json"
          if [ -f "$base/$KB/accreta.config.yaml" ] && (
            cd "$base/$KB" &&
              export ACCRETA_INDEX_PATH="$RUNNER_TEMP/accreta-base.sqlite" &&
              bun "$cli" reindex >/dev/null &&
              { bun "$cli" drift --json >"$report" || [ -s "$report" ]; }
          ); then
            compare=(--base "$report")
          else
            echo "::notice::No knowledge base to compare with on the base branch: every page in doubt counts as new."
          fi
        else
          echo "::notice::HEAD is not a merge commit, so there is no base branch to compare with."
        fi

        # Exit 1 means drift found something; any other failure leaves the report empty.
        bun "$cli" drift --format github "${compare[@]}" >"$RUNNER_TEMP/accreta-drift.md" || true
        if [ ! -s "$RUNNER_TEMP/accreta-drift.md" ]; then
          echo "::error::accreta drift failed before writing a report."
          exit 1
        fi
        bun "$cli" drift --json "${compare[@]}" >"$RUNNER_TEMP/accreta-drift.json" || true
        bun -e '
          const r = JSON.parse(await Bun.file(process.argv[1]).text());
          console.log(`pages-in-doubt=${r.pages_in_doubt}`);
          console.log(`pages-newly-in-doubt=${r.pages_newly_in_doubt}`);
          console.log(`pages-unplaceable=${r.pages_unplaceable}`);
        ' "$RUNNER_TEMP/accreta-drift.json" >>"$GITHUB_OUTPUT"

    - name: Comment on the pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRIFT_REPORT: ${{ runner.temp }}/accreta-drift.md
        DRIFT_KEY: ${{ inputs.working-directory }}
        DRIFT_AUTHOR: ${{ inputs.comment-author }}
        DRIFT_CREATE: ${{ inputs.comment-when-clean == 'true' || steps.drift.outputs.pages-newly-in-doubt != '0' }}
      run: bun "$GITHUB_ACTION_PATH/scripts/drift-comment.ts"

    - name: Fail on drift
      if: ${{ inputs.fail-on-drift == 'true' && steps.drift.outputs.pages-newly-in-doubt != '0' }}
      shell: bash
      run: |
        echo "::error::This pull request puts knowledge base pages in doubt."
        exit 1
